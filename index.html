<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuhfe 🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at bottom, #160c28 0%, #06030d 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', sans-serif;
            position: relative;
        }

        /* Yıldız ve Kayan Yıldız Canvas'ı */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Ana İçerik Alanı */
        .container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        /* İsim ve Kalp Alanı */
        .title-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
            opacity: 0;
            transform: translateY(-20px);
            animation: fadeInDown 2s ease-out 0.8s forwards;
        }

        .name {
            font-family: 'Cinzel Decorative', cursive;
            font-size: clamp(2.8rem, 8vw, 4.8rem);
            color: #fff;
            letter-spacing: 4px;
            text-shadow: 
                0 0 10px rgba(255, 182, 193, 0.8),
                0 0 25px rgba(255, 105, 180, 0.6),
                0 0 45px rgba(219, 112, 147, 0.4);
        }

        /* Atan Kalp Animasyonu */
        .heart {
            font-size: clamp(2.2rem, 6vw, 3.8rem);
            color: #ff3366;
            filter: drop-shadow(0 0 15px rgba(255, 51, 102, 0.9));
            animation: heartbeat 1.4s infinite ease-in-out;
            display: inline-block;
        }

        /* Lilyum Çiçeği SVG Alanı */
        .lily-wrapper {
            width: clamp(280px, 70vw, 420px);
            height: clamp(320px, 75vw, 460px);
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 0 25px rgba(255, 192, 203, 0.25));
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* Sap ve Yaprak Animasyonları */
        .stem {
            stroke-dasharray: 400;
            stroke-dashoffset: 400;
            animation: drawStem 2.2s ease-out 0.3s forwards;
        }

        .leaf {
            opacity: 0;
            transform-origin: bottom center;
            animation: growLeaf 1.8s ease-out 1.4s forwards;
        }

        /* Lilyum Yaprakları (Taç Yapraklar) */
        .petal {
            opacity: 0;
            transform-origin: 200px 180px;
        }

        .petal-back-1 { animation: bloomBack1 2.2s cubic-bezier(0.22, 1, 0.36, 1) 1.8s forwards; }
        .petal-back-2 { animation: bloomBack2 2.2s cubic-bezier(0.22, 1, 0.36, 1) 1.9s forwards; }
        .petal-back-3 { animation: bloomBack3 2.2s cubic-bezier(0.22, 1, 0.36, 1) 2.0s forwards; }
        
        .petal-front-1 { animation: bloomFront1 2.2s cubic-bezier(0.22, 1, 0.36, 1) 2.2s forwards; }
        .petal-front-2 { animation: bloomFront2 2.2s cubic-bezier(0.22, 1, 0.36, 1) 2.3s forwards; }
        .petal-front-3 { animation: bloomFront3 2.2s cubic-bezier(0.22, 1, 0.36, 1) 2.4s forwards; }

        /* Polenler ve Çiller */
        .stamen {
            opacity: 0;
            animation: fadeIn 1.5s ease-out 3.2s forwards, sway 4s ease-in-out 4.7s infinite alternate;
            transform-origin: 200px 180px;
        }

        .flower-float {
            animation: floatFlower 5s ease-in-out 3.5s infinite alternate;
        }

        /* Sol Alt İmza */
        .signature {
            position: fixed;
            bottom: 18px;
            left: 22px;
            z-index: 3;
            color: rgba(255, 255, 255, 0.55);
            font-size: 0.78rem;
            letter-spacing: 3px;
            font-weight: 500;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(255, 182, 193, 0.4);
            opacity: 0;
            animation: fadeIn 2s ease-out 2.5s forwards;
        }

        /* Keyframes */
        @keyframes fadeInDown {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.25); }
            30% { transform: scale(1); }
            45% { transform: scale(1.18); }
            60% { transform: scale(1); }
        }

        @keyframes drawStem {
            to { stroke-dashoffset: 0; }
        }

        @keyframes growLeaf {
            0% { opacity: 0; transform: scale(0.3); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes bloomBack1 {
            0% { opacity: 0; transform: scale(0.1) rotate(0deg); }
            100% { opacity: 1; transform: scale(1) rotate(-55deg); }
        }
        @keyframes bloomBack2 {
            0% { opacity: 0; transform: scale(0.1) rotate(0deg); }
            100% { opacity: 1; transform: scale(1) rotate(55deg); }
        }
        @keyframes bloomBack3 {
            0% { opacity: 0; transform: scale(0.1) rotate(0deg); }
            100% { opacity: 1; transform: scale(1) rotate(180deg); }
        }

        @keyframes bloomFront1 {
            0% { opacity: 0; transform: scale(0.1) rotate(0deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        @keyframes bloomFront2 {
            0% { opacity: 0; transform: scale(0.1) rotate(0deg); }
            100% { opacity: 1; transform: scale(1) rotate(-118deg); }
        }
        @keyframes bloomFront3 {
            0% { opacity: 0; transform: scale(0.1) rotate(0deg); }
            100% { opacity: 1; transform: scale(1) rotate(118deg); }
        }

        @keyframes sway {
            0% { transform: rotate(-2deg); }
            100% { transform: rotate(2deg); }
        }

        @keyframes floatFlower {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-8px); }
        }
    </style>
</head>
<body>

    <canvas id="starfield"></canvas>

    <div class="container">
        <div class="title-wrapper">
            <h1 class="name">Tuhfe</h1>
            <span class="heart">❤</span>
        </div>

        <div class="lily-wrapper">
            <svg viewBox="0 0 400 450" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Taç Yaprak Gradyanları -->
                    <linearGradient id="petalGrad" x1="0%" y1="100%" x2="0%" y2="0%">
                        <stop offset="0%" stop-color="#c9e265" />
                        <stop offset="18%" stop-color="#f78fb3" />
                        <stop offset="55%" stop-color="#ffcce0" />
                        <stop offset="100%" stop-color="#ffffff" />
                    </linearGradient>

                    <linearGradient id="petalBackGrad" x1="0%" y1="100%" x2="0%" y2="0%">
                        <stop offset="0%" stop-color="#9db84b" />
                        <stop offset="25%" stop-color="#e66794" />
                        <stop offset="65%" stop-color="#f8a5c2" />
                        <stop offset="100%" stop-color="#ffe6f0" />
                    </linearGradient>

                    <!-- Sap ve Yaprak Gradyanı -->
                    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#2d5a27" />
                        <stop offset="50%" stop-color="#4e944f" />
                        <stop offset="100%" stop-color="#2d5a27" />
                    </linearGradient>

                    <!-- Polen Gradyanı -->
                    <radialGradient id="pollenGrad">
                        <stop offset="0%" stop-color="#ffd32a" />
                        <stop offset="70%" stop-color="#ff9f1a" />
                        <stop offset="100%" stop-color="#cd6133" />
                    </radialGradient>

                    <!-- Tekil Lilyum Yaprağı Tanımı -->
                    <g id="lily-petal-shape">
                        <path d="M 200 180 C 175 135, 165 75, 200 25 C 235 75, 225 135, 200 180 Z" />
                        <!-- Orta Damar Çizgisi -->
                        <path d="M 200 175 Q 200 105 200 35" stroke="#e84393" stroke-width="1.2" stroke-opacity="0.45" fill="none" />
                        <!-- Lilyum Çilleri -->
                        <circle cx="194" cy="135" r="1.5" fill="#8e1b4d" opacity="0.6" />
                        <circle cx="206" cy="130" r="1.5" fill="#8e1b4d" opacity="0.6" />
                        <circle cx="192" cy="118" r="1.3" fill="#8e1b4d" opacity="0.5" />
                        <circle cx="208" cy="115" r="1.4" fill="#8e1b4d" opacity="0.5" />
                        <circle cx="197" cy="105" r="1.2" fill="#8e1b4d" opacity="0.4" />
                        <circle cx="204" cy="100" r="1.2" fill="#8e1b4d" opacity="0.4" />
                    </g>
                </defs>

                <!-- Çiçek Sapı -->
                <path class="stem" d="M 200 440 Q 192 310 200 180" stroke="url(#stemGrad)" stroke-width="7" stroke-linecap="round" fill="none" />

                <!-- Sap Yaprakları -->
                <path class="leaf" d="M 197 340 C 145 320, 110 345, 95 375 C 130 370, 165 360, 197 345 Z" fill="url(#stemGrad)" />
                <path class="leaf" d="M 202 300 C 255 275, 290 295, 310 325 C 275 325, 235 318, 202 306 Z" fill="url(#stemGrad)" />
                <path class="leaf" d="M 198 255 C 155 235, 130 250, 118 272 C 145 268, 175 265, 198 260 Z" fill="url(#stemGrad)" />

                <!-- Çiçek Başlığı -->
                <g class="flower-float">
                    <!-- Arka 3 Yaprak -->
                    <use href="#lily-petal-shape" class="petal petal-back-1" fill="url(#petalBackGrad)" />
                    <use href="#lily-petal-shape" class="petal petal-back-2" fill="url(#petalBackGrad)" />
                    <use href="#lily-petal-shape" class="petal petal-back-3" fill="url(#petalBackGrad)" />

                    <!-- Ön 3 Yaprak -->
                    <use href="#lily-petal-shape" class="petal petal-front-1" fill="url(#petalGrad)" />
                    <use href="#lily-petal-shape" class="petal petal-front-2" fill="url(#petalGrad)" />
                    <use href="#lily-petal-shape" class="petal petal-front-3" fill="url(#petalGrad)" />

                    <!-- Polenler ve Tepecik (Stamen & Pistil) -->
                    <g class="stamen">
                        <!-- Filamentler -->
                        <path d="M 200 180 Q 180 140 168 115" stroke="#b8e994" stroke-width="2" fill="none" />
                        <path d="M 200 180 Q 220 140 232 115" stroke="#b8e994" stroke-width="2" fill="none" />
                        <path d="M 200 180 Q 175 165 150 155" stroke="#b8e994" stroke-width="2" fill="none" />
                        <path d="M 200 180 Q 225 165 250 155" stroke="#b8e994" stroke-width="2" fill="none" />
                        <path d="M 200 180 Q 200 135 200 105" stroke="#78e08f" stroke-width="2.5" fill="none" />

                        <!-- Polen Başlıkları -->
                        <ellipse cx="168" cy="113" rx="6" ry="3" transform="rotate(-30 168 113)" fill="url(#pollenGrad)" />
                        <ellipse cx="232" cy="113" rx="6" ry="3" transform="rotate(30 232 113)" fill="url(#pollenGrad)" />
                        <ellipse cx="150" cy="155" rx="6" ry="3" transform="rotate(-15 150 155)" fill="url(#pollenGrad)" />
                        <ellipse cx="250" cy="155" rx="6" ry="3" transform="rotate(15 250 155)" fill="url(#pollenGrad)" />
                        <!-- Orta Tepecik -->
                        <circle cx="200" cy="103" r="4.5" fill="#badc58" />
                    </g>
                </g>
            </svg>
        </div>
    </div>

    <div class="signature">DESIGN: EGE</div>

    <script>
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];
        let shootingStars = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Parlayan Sabit Yıldızlar
        class Star {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.4;
                this.alpha = Math.random();
                this.speed = (Math.random() * 0.02 + 0.005) * (Math.random() < 0.5 ? 1 : -1);
            }
            update() {
                this.alpha += this.speed;
                if (this.alpha >= 1) {
                    this.alpha = 1;
                    this.speed *= -1;
                } else if (this.alpha <= 0.15) {
                    this.alpha = 0.15;
                    this.speed *= -1;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 245, 250, ${this.alpha})`;
                ctx.shadowBlur = this.size * 4;
                ctx.shadowColor = '#ffffff';
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        // Kayan Yıldızlar
        class ShootingStar {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width * 1.2;
                this.y = Math.random() * height * 0.4;
                this.len = Math.random() * 90 + 50;
                this.speed = Math.random() * 8 + 6;
                this.size = Math.random() * 1.5 + 0.8;
                this.angle = Math.PI / 4 + (Math.random() * 0.15 - 0.075); // Sağ üstten sol alta doğru
                this.active = false;
                this.waitTime = Math.random() * 200;
            }
            update() {
                if (!this.active) {
                    this.waitTime--;
                    if (this.waitTime <= 0) {
                        this.active = true;
                    }
                    return;
                }

                this.x -= Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

                if (this.x < -this.len || this.y > height + this.len) {
                    this.reset();
                    this.waitTime = Math.random() * 250 + 60;
                }
            }
            draw() {
                if (!this.active) return;

                const tailX = this.x + Math.cos(this.angle) * this.len;
                const tailY = this.y - Math.sin(this.angle) * this.len;

                const grad = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
                grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
                grad.addColorStop(0.3, 'rgba(255, 192, 203, 0.6)');
                grad.addColorStop(1, 'rgba(255, 255, 255, 0)');

                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(tailX, tailY);
                ctx.strokeStyle = grad;
                ctx.lineWidth = this.size;
                ctx.lineCap = 'round';
                ctx.stroke();

                // Yıldız başı parlaması
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 1.3, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            }
        }

        // Yıldızları oluştur
        const starCount = Math.min(160, Math.floor((width * height) / 7000));
        for (let i = 0; i < starCount; i++) {
            stars.push(new Star());
        }

        // Aynı anda ekranda dönen 4 kayan yıldız havuzu
        for (let i = 0; i < 4; i++) {
            const s = new ShootingStar();
            s.waitTime = i * 70;
            shootingStars.push(s);
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            stars.forEach(star => {
                star.update();
                star.draw();
            });

            shootingStars.forEach(sStar => {
                sStar.update();
                sStar.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
